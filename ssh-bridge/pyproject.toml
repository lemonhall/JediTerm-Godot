[project]
name = "ssh-bridge"
version = "0.1.0"
description = "SSH Remote Terminal via WebSocket Bridge (for JediTerm-Godot)"
requires-python = ">=3.13"
dependencies = [
  "asyncssh>=2.14.0",
  "starlette>=0.37.0",
  "uvicorn>=0.30.0",
  "websockets>=12.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:debugging"
pythonpath = ["."]
