<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>JediTerm-Godot</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

#ime-input {
	position: fixed;
	left: -9999px;
	top: 0;
	width: 1px;
	height: 1px;
	opacity: 0;
	z-index: 9999;
	ime-mode: active;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="JediTerm-Godot.icon.png" />
<link rel="apple-touch-icon" href="JediTerm-Godot.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<textarea id="ime-input" autocapitalize="off" autocomplete="off" spellcheck="false"></textarea>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="JediTerm-Godot.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="JediTerm-Godot.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"JediTerm-Godot","experimentalVK":false,"fileSizes":{"JediTerm-Godot.pck":51305480,"JediTerm-Godot.wasm":35740641},"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

/* ============ IME Bridge ============ */
(function () {
	const imeInput = document.getElementById('ime-input');
	const canvas = document.getElementById('canvas');
	let imeWs = null;   // 复用终端的 WebSocket
	let isComposing = false;

	// 从 Godot 的 WebSocket 连接中拿到引用，或者自己建一个
	// 这里用一个全局钩子，让 GDScript 端连接成功后把 ws url 告诉我们
	window.JediTermIME = {
		// GDScript 端调用：window.JediTermIME.setBridgeUrl("ws://127.0.0.1:8765/ws")
		setBridgeUrl: function (url) {
			// 不需要自己建 ws，直接用 sendText 就行
		},
		// 直接发送文本到终端（由 GDScript 端注入实现）
		_sendText: null,
		sendText: function (text) {
			if (window.JediTermIME._sendText) {
				window.JediTermIME._sendText(text);
			}
		}
	};

	// 点击 canvas 时把焦点偷偷给 textarea（触发 IME）
	canvas.addEventListener('click', function () {
		imeInput.focus({ preventScroll: true });
	});

	// canvas 的 keydown 也转给 textarea（保持 IME 焦点）
	canvas.addEventListener('focus', function () {
		imeInput.focus({ preventScroll: true });
	});

	imeInput.addEventListener('compositionstart', function () {
		isComposing = true;
	});

	imeInput.addEventListener('compositionend', function (e) {
		isComposing = false;
		const text = e.data;
		if (text) {
			window.JediTermIME.sendText(text);
		}
		imeInput.value = '';
	});

	// 非 IME 按键（英文、回车、方向键等）交还给 canvas
	imeInput.addEventListener('keydown', function (e) {
		if (!isComposing) {
			// 把事件转发给 canvas，让 Godot 处理
			canvas.dispatchEvent(new KeyboardEvent('keydown', {
				key: e.key,
				code: e.code,
				keyCode: e.keyCode,
				which: e.which,
				shiftKey: e.shiftKey,
				ctrlKey: e.ctrlKey,
				altKey: e.altKey,
				metaKey: e.metaKey,
				bubbles: true,
				cancelable: true
			}));
			canvas.dispatchEvent(new KeyboardEvent('keyup', {
				key: e.key,
				code: e.code,
				keyCode: e.keyCode,
				which: e.which,
				shiftKey: e.shiftKey,
				ctrlKey: e.ctrlKey,
				altKey: e.altKey,
				metaKey: e.metaKey,
				bubbles: true,
				cancelable: true
			}));
			e.preventDefault();
			// 清掉英文字符，防止堆积
			imeInput.value = '';
		}
	});
})();

/* ============ Godot Engine Startup ============ */
(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
